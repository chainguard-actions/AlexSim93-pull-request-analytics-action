name: Test markdown and collection combined output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: "AlexSim93/pull-request-analytics-action"
          EXECUTION_OUTCOME: "markdown, collection"
          AMOUNT: "10"
          SHOW_STATS_TYPES: "timeline, pr-quality"
          REQUIRED_APPROVALS: "1"
          ALLOW_ANALYTICS: "false"
          REPORT_PERIOD: "years:2"
          PERCENTILE: "75"
          AGGREGATE_VALUE_METHODS: "percentile, average"

      - name: Assert JSON_COLLECTION output is set
        env:
          ACTUAL: ${{ steps.action.outputs.JSON_COLLECTION }}
        run: |
          echo "actual (first 300 chars): ${ACTUAL:0:300}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: JSON_COLLECTION output is empty"
            exit 1
          fi
          echo "PASS: JSON_COLLECTION output is non-empty"

      - name: Assert JSON_COLLECTION is valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.JSON_COLLECTION }}
        run: |
          echo "$ACTUAL" | python3 -m json.tool > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: JSON_COLLECTION is not valid JSON"
            echo "actual: $ACTUAL"
            exit 1
          fi
          echo "PASS: JSON_COLLECTION is valid JSON"

      - name: Assert MARKDOWN output is set
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          echo "actual (first 300 chars): ${ACTUAL:0:300}"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: MARKDOWN output is empty (no merged PRs found in period)"
          else
            echo "PASS: MARKDOWN output is non-empty"
          fi
          echo "PASS: action completed successfully"
