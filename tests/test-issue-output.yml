name: Test issue output inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNERS_REPOS: "actions/checkout"
          GITHUB_REPO_FOR_ISSUE: "checkout"
          GITHUB_OWNER_FOR_ISSUE: "actions"
          ORGANIZATIONS: "actions"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "5"
          SHOW_STATS_TYPES: "timeline"
          REQUIRED_APPROVALS: "1"
          ISSUE_TITLE: "PR Analytics Report"
          ISSUE_NUMBER: "1"
          ALLOW_ANALYTICS: false
        continue-on-error: true
      - name: Assert step ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with issue output inputs"
