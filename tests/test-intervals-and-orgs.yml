name: Test time intervals and organizations inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ORGANIZATIONS: "octocat"
          EXECUTION_OUTCOME: "markdown"
          REVIEW_TIME_INTERVALS: "2,8,24"
          APPROVAL_TIME_INTERVALS: "2,8,24"
          MERGE_TIME_INTERVALS: "2,8,24"
          REQUIRED_APPROVALS: "2"
          AMOUNT: "10"
          ALLOW_ANALYTICS: false
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
