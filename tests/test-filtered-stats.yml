name: Test filtered stats with custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: "AlexSim93/pull-request-analytics-action"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REPORT_PERIOD: "years:2"
          SHOW_STATS_TYPES: "pr-quality, code-review-engagement"
          PERCENTILE: "90"
          TOP_LIST_AMOUNT: "3"
          AGGREGATE_VALUE_METHODS: "percentile, average"
          PERIOD_SPLIT_UNIT: "none"
          ALLOW_ANALYTICS: false
      - name: Assert MARKDOWN output is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          echo "actual (first 500 chars): ${ACTUAL:0:500}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: MARKDOWN output is empty"
            exit 1
          fi
          echo "PASS: MARKDOWN output is non-empty"
