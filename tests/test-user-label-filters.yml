name: Test user and label filter inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNERS_REPOS: "octocat/Hello-World"
          EXECUTION_OUTCOME: "markdown"
          HIDE_USERS: "bot-user"
          SHOW_USERS: "octocat"
          INCLUDE_USERS: "octocat"
          EXCLUDE_USERS: "bot-user"
          INCLUDE_LABELS: "feature,bug"
          EXCLUDE_LABELS: "wip,draft"
          REQUIRED_APPROVALS: "1"
          AMOUNT: "10"
          ALLOW_ANALYTICS: false
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
