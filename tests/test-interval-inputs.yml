name: Test interval and organization inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNERS_REPOS: "AlexSim93/pull-request-analytics-action"
          ORGANIZATIONS: "AlexSim93"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REPORT_PERIOD: "weeks:2"
          REVIEW_TIME_INTERVALS: "2,8,24"
          APPROVAL_TIME_INTERVALS: "2,8,24"
          MERGE_TIME_INTERVALS: "2,8,24"
          ISSUE_NUMBER: "1"
          ALLOW_ANALYTICS: false
      - name: Assert markdown output exists
        env:
          MARKDOWN: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "markdown length: ${#MARKDOWN}"
          if [ -z "$MARKDOWN" ]; then
            echo "FAIL: MARKDOWN output is empty"
            exit 1
          fi
          echo "PASS"
