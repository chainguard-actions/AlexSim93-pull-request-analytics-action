name: Test time-related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNERS_REPOS: "AlexSim93/pull-request-analytics-action"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REPORT_DATE_START: "1/01/2024"
          REPORT_DATE_END: "31/12/2024"
          CORE_HOURS_START: "09:00"
          CORE_HOURS_END: "18:00"
          TIMEZONE: "UTC"
          HOLIDAYS: "1/01/2024,25/12/2024"
          WEEKENDS: "0,6"
          ALLOW_ANALYTICS: false
      - name: Assert markdown output exists
        env:
          MARKDOWN: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "markdown length: ${#MARKDOWN}"
          if [ -z "$MARKDOWN" ]; then
            echo "FAIL: MARKDOWN output is empty"
            exit 1
          fi
          echo "PASS"
