name: Test issue and interval inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNERS_REPOS: "actions/checkout"
          ORGANIZATIONS: ""
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "5"
          REPORT_PERIOD: "weeks:1"
          ISSUE_TITLE: "PR Analytics Report"
          ISSUE_NUMBER: "1"
          LABELS: "analytics,report"
          ASSIGNEES: "octocat"
          FILTER_HEAD_BRANCHES: "^feature/"
          FILTER_BASE_BRANCHES: "^main$"
          REVIEW_TIME_INTERVALS: "2,8,24"
          APPROVAL_TIME_INTERVALS: "2,8,24"
          MERGE_TIME_INTERVALS: "2,8,24"
          ALLOW_ANALYTICS: false
        continue-on-error: true
      - name: Assert action completed
        run: |
          echo "PASS: action completed with issue and interval inputs"
