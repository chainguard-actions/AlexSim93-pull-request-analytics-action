name: Test date range filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: "AlexSim93/pull-request-analytics-action"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "50"
          REPORT_DATE_START: "1/01/2023"
          REPORT_DATE_END: "31/12/2024"
          REQUIRED_APPROVALS: "1"
          SHOW_STATS_TYPES: "timeline"
          ALLOW_ANALYTICS: false
      - name: Assert MARKDOWN output is set
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "MARKDOWN (first 500 chars): ${ACTUAL:0:500}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: MARKDOWN output is empty"
            exit 1
          fi
          echo "PASS: MARKDOWN output is non-empty"
