name: Test time interval and calendar inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_OUTCOME: "collection"
          AMOUNT: "10"
          REPORT_PERIOD: "days:7"
          SHOW_STATS_TYPES: "timeline"
          REVIEW_TIME_INTERVALS: "2,8,24"
          APPROVAL_TIME_INTERVALS: "2,8,24"
          MERGE_TIME_INTERVALS: "2,8,24"
          TIMEZONE: "UTC"
          CORE_HOURS_START: "09:00"
          CORE_HOURS_END: "18:00"
          HOLIDAYS: "1/01/2024,25/12/2024"
          ALLOW_ANALYTICS: false
      - name: Assert JSON_COLLECTION output is set
        env:
          ACTUAL: ${{ steps.action.outputs.JSON_COLLECTION }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: JSON_COLLECTION output is empty"
            exit 1
          fi
          echo "PASS: JSON_COLLECTION is set"
