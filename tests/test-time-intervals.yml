name: Test time interval inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: ${{ github.repository }}
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REPORT_PERIOD: "weeks:1"
          SHOW_STATS_TYPES: "timeline"
          REVIEW_TIME_INTERVALS: "2,8,24"
          APPROVAL_TIME_INTERVALS: "4,12,48"
          MERGE_TIME_INTERVALS: "1,6,24"
          ALLOW_ANALYTICS: false
      - name: Assert markdown output is present
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected MARKDOWN output to be non-empty"
            exit 1
          fi
          echo "PASS"
