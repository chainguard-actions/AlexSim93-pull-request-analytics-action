name: Test holidays and discussion type pattern inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: ${{ github.repository }}
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REPORT_PERIOD: "weeks:4"
          HOLIDAYS: "1/01/2024,25/12/2024"
          DISCUSSION_TYPE_PATTERN: "^(bug|feature|question):"
          ALLOW_ANALYTICS: false
      - name: Assert markdown output is present
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected MARKDOWN output to be non-empty"
            exit 1
          fi
          echo "PASS"
