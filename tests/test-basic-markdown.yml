name: Test basic markdown output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: "AlexSim93/pull-request-analytics-action"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          SHOW_STATS_TYPES: "timeline, workload, pr-quality, code-review-engagement, response-time"
          REQUIRED_APPROVALS: "1"
          ALLOW_ANALYTICS: "false"
          REPORT_PERIOD: "years:2"

      - name: Assert MARKDOWN output is set
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          echo "actual (first 500 chars): ${ACTUAL:0:500}"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: MARKDOWN output is empty (no PRs found in period or empty repo)"
          else
            echo "PASS: MARKDOWN output is non-empty"
          fi
          echo "PASS: action completed successfully"
