name: Test organization, date range, and issue number inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_OUTCOME: "collection"
          AMOUNT: "10"
          REPORT_DATE_START: "1/01/2024"
          REPORT_DATE_END: "31/01/2024"
          SHOW_STATS_TYPES: "timeline"
          ISSUE_NUMBER: "1"
          ALLOW_ANALYTICS: false
      - name: Assert JSON_COLLECTION output is set
        env:
          ACTUAL: ${{ steps.action.outputs.JSON_COLLECTION }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: JSON_COLLECTION output is empty"
            exit 1
          fi
          echo "PASS: JSON_COLLECTION is set"
