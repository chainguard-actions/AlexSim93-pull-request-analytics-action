name: Test date filtering inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNERS_REPOS: "actions/checkout"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "5"
          SHOW_STATS_TYPES: "timeline"
          REQUIRED_APPROVALS: "1"
          REPORT_DATE_START: "1/01/2024"
          REPORT_DATE_END: "31/12/2024"
          REPORT_PERIOD: "weeks:2"
          TIMEZONE: "UTC"
          ALLOW_ANALYTICS: false
        continue-on-error: true
      - name: Assert step ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with date filtering inputs"
