name: Test date-filtered report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: "actions/checkout"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "20"
          REQUIRED_APPROVALS: "1"
          REPORT_PERIOD: "weeks:4"
          SHOW_STATS_TYPES: "timeline, pr-quality, code-review-engagement"
          PERIOD_SPLIT_UNIT: "none"
          PERCENTILE: "50"
          AGGREGATE_VALUE_METHODS: "median"
          ALLOW_ANALYTICS: false

      - name: Assert MARKDOWN output is produced
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: MARKDOWN output is empty"
            exit 1
          fi
          echo "PASS: MARKDOWN output is non-empty"

      - name: Assert MARKDOWN output contains report structure
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual (first 500 chars): ${ACTUAL:0:500}"
          if echo "$ACTUAL" | grep -qiE "pull request|PR|review|merged|open|closed|timeline|quality|engagement|No data|week"; then
            echo "PASS: MARKDOWN contains expected report content"
          else
            echo "FAIL: MARKDOWN does not contain expected report content"
            exit 1
          fi
