name: Test organizations input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_OUTCOME: "collection"
          AMOUNT: "5"
          REPORT_PERIOD: "days:7"
          SHOW_STATS_TYPES: "timeline"
          ORGANIZATIONS: ${{ github.repository_owner }}
          ALLOW_ANALYTICS: false
      - name: Assert JSON_COLLECTION output is set
        env:
          ACTUAL: ${{ steps.action.outputs.JSON_COLLECTION }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: JSON_COLLECTION output is empty"
            exit 1
          fi
          echo "PASS: JSON_COLLECTION is set"
