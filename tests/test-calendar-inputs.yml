name: Test calendar and core hours inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: ${{ github.repository }}
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REPORT_PERIOD: "weeks:1"
          CORE_HOURS_START: "09:00"
          CORE_HOURS_END: "18:00"
          HOLIDAYS: "1/01/2024,25/12/2024"
          ISSUE_NUMBER: "1"
          REQUIRED_APPROVALS: "1"
          ALLOW_ANALYTICS: false
      - name: Assert markdown output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty MARKDOWN output"
            exit 1
          fi
          echo "PASS"
