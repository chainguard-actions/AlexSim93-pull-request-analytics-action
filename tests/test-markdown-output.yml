name: Test markdown output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: "actions/checkout"
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REQUIRED_APPROVALS: "1"
          SHOW_STATS_TYPES: "timeline, workload"
          PERIOD_SPLIT_UNIT: "none"
          ALLOW_ANALYTICS: false

      - name: Assert MARKDOWN output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: MARKDOWN output is empty"
            exit 1
          fi
          echo "PASS: MARKDOWN output is non-empty"

      - name: Assert MARKDOWN contains expected content
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual (first 500 chars): ${ACTUAL:0:500}"
          if echo "$ACTUAL" | grep -qi "pull request\|PR\|review\|merged\|open\|closed\|timeline\|workload\|No data"; then
            echo "PASS: MARKDOWN contains expected analytics content"
          else
            echo "FAIL: MARKDOWN does not contain expected analytics content"
            exit 1
          fi
