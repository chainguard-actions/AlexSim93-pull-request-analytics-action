name: Test issue-related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: ${{ github.repository }}
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REPORT_PERIOD: "weeks:1"
          LABELS: "bug,enhancement"
          ASSIGNEES: "octocat"
          ISSUE_TITLE: "PR Analytics Report"
          GITHUB_REPO_FOR_ISSUE: ${{ github.event.repository.name }}
          GITHUB_OWNER_FOR_ISSUE: ${{ github.repository_owner }}
          REQUIRED_APPROVALS: "1"
          ALLOW_ANALYTICS: false
      - name: Assert markdown output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty MARKDOWN output"
            exit 1
          fi
          echo "PASS"
