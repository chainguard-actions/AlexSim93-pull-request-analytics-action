name: Test issue-related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "10"
          REPORT_PERIOD: "days:7"
          SHOW_STATS_TYPES: "timeline"
          ISSUE_TITLE: "PR Analytics Report"
          LABELS: "analytics,report"
          ASSIGNEES: "octocat"
          GITHUB_REPO_FOR_ISSUE: ${{ github.event.repository.name }}
          GITHUB_OWNER_FOR_ISSUE: ${{ github.repository_owner }}
          ALLOW_ANALYTICS: false
      - name: Assert MARKDOWN output is set
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: MARKDOWN output is empty"
            exit 1
          fi
          echo "PASS: MARKDOWN is set"
