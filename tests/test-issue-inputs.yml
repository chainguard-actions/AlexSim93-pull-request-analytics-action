name: Test issue and organization inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "5"
          GITHUB_REPO_FOR_ISSUE: ${{ github.event.repository.name }}
          GITHUB_OWNER_FOR_ISSUE: ${{ github.repository_owner }}
          ISSUE_TITLE: "PR Analytics Report"
          ISSUE_NUMBER: ""
          ORGANIZATIONS: ""
          REQUIRED_APPROVALS: "1"
          ALLOW_ANALYTICS: false
      - name: Assert markdown output is present
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected MARKDOWN output to be non-empty"
            exit 1
          fi
          echo "PASS"
