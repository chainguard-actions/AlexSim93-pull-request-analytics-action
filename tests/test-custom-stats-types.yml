name: Test custom stats types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNERS_REPOS: "AlexSim93/pull-request-analytics-action"
          AMOUNT: "5"
          EXECUTION_OUTCOME: "markdown"
          SHOW_STATS_TYPES: "timeline"
          REQUIRED_APPROVALS: "1"
          PERCENTILE: "90"
          AGGREGATE_VALUE_METHODS: "percentile, average"
          PERIOD_SPLIT_UNIT: "none"
          ALLOW_ANALYTICS: "false"

      - name: Assert MARKDOWN output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual (first 500 chars): ${ACTUAL:0:500}"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ]; then
            echo "FAIL: MARKDOWN output is empty or whitespace-only"
            exit 1
          fi
          echo "PASS: MARKDOWN output is non-empty"
