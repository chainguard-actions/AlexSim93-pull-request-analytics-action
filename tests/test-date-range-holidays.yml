name: Test date range, holidays, and organizations inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_OUTCOME: "markdown"
          AMOUNT: "1"
          REPORT_DATE_START: "1/01/2024"
          REPORT_DATE_END: "31/12/2024"
          HOLIDAYS: "25/12/2024,1/01/2024"
          ORGANIZATIONS: "github"
          REQUIRED_APPROVALS: "1"
      - name: Assert markdown output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.MARKDOWN }}
        run: |
          echo "actual length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty MARKDOWN output"
            exit 1
          fi
          echo "PASS"
